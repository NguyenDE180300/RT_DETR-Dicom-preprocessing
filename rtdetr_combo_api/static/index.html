<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RT-DETR DICOM Prediction</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        --bg: #f5f7fb;
        --ink: #172033;
        --muted: #667085;
        --line: #d8dee9;
        --panel: #ffffff;
        --accent: #0f766e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        padding: 20px 28px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px;
      }
      .toolbar {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) 150px 150px auto;
        gap: 12px;
        align-items: end;
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      input[type="file"], input[type="number"] {
        width: 100%;
        min-height: 38px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
      }
      button {
        min-height: 38px;
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .status {
        margin: 14px 2px;
        min-height: 22px;
        color: var(--muted);
        font-size: 14px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .panel h2 {
        margin: 0;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
      }
      .panel img {
        display: block;
        width: 100%;
        height: auto;
        background: #111827;
      }
      @media (max-width: 820px) {
        main { padding: 14px; }
        .toolbar { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>RT-DETR DICOM Prediction</h1>
    </header>
    <main>
      <form class="toolbar" id="predictForm">
        <label>
          DICOM
          <input id="file" type="file" accept=".dcm,.dicom,application/dicom" required />
        </label>
        <label>
          Confidence
          <input id="conf" type="number" min="0" max="1" step="0.01" value="0.25" />
        </label>
        <label>
          IoU
          <input id="iou" type="number" min="0" max="1" step="0.01" value="0.50" />
        </label>
        <button id="submitBtn" type="submit">Predict</button>
      </form>

      <div class="status" id="status"></div>

      <section id="output" hidden>
        <article class="panel">
          <h2>Prediction</h2>
          <img id="predictionImg" alt="Prediction output" />
        </article>
      </section>
    </main>

    <script>
      const form = document.getElementById("predictForm");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");
      const output = document.getElementById("output");
      const predictionImg = document.getElementById("predictionImg");
      let currentObjectUrl = null;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = document.getElementById("file").files[0];
        if (!file) return;

        const conf = document.getElementById("conf").value;
        const iou = document.getElementById("iou").value;
        const data = new FormData();
        data.append("file", file);

        submitBtn.disabled = true;
        statusEl.textContent = "Dang xu ly DICOM va chay RT-DETR...";
        output.hidden = true;

        try {
          const res = await fetch(`/predict-image?conf=${conf}&iou=${iou}`, {
            method: "POST",
            body: data,
          });
          if (!res.ok) {
            const json = await res.json();
            throw new Error(json.detail || "Predict failed");
          }

          if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
          currentObjectUrl = URL.createObjectURL(await res.blob());
          predictionImg.src = currentObjectUrl;
          output.hidden = false;
          statusEl.textContent = "Xong.";
        } catch (err) {
          statusEl.textContent = `Loi: ${err.message}`;
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
